<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiyeFlow Block Renderer Debug</title>
    <link rel="stylesheet" href="../src/styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            color: #c9d1d9;
            height: 100vh;
            overflow: hidden;
        }
        
        .debug-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        h1 {
            color: #58a6ff;
            margin: 0;
            padding: 20px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: #161b22;
            border-bottom: 2px solid #30363d;
            overflow-x: auto;
        }
        
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #8b949e;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .tab:hover {
            color: #c9d1d9;
            background: #0d1117;
        }
        
        .tab.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
        }
        
        /* Tab content */
        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }
        
        .tab-content.active {
            display: flex;
        }
        
        /* Four column layout */
        .four-column {
            display: flex;
            flex: 1;
            height: 100%;
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
            overflow: hidden;
            min-width: 250px;
        }
        
        .column:nth-child(3) {
            flex: 1.2; /* Slightly wider for TypeScript model */
        }
        
        .column:last-child {
            border-right: none;
        }
        
        .column-header {
            padding: 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            color: #58a6ff;
        }
        
        .column-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        /* Schema column */
        .schema-content {
            background: #0d1117;
            display: flex;
            flex-direction: column;
        }
        
        .schema-editor {
            flex: 1;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 16px;
            resize: none;
            outline: none;
        }
        
        .schema-editor:focus {
            border-color: #58a6ff;
        }
        
        .schema-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 16px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        .btn:hover {
            background: #2ea043;
        }
        
        .btn-secondary {
            background: #30363d;
        }
        
        .btn-secondary:hover {
            background: #484f58;
        }
        
        .error-message {
            margin-top: 12px;
            padding: 12px;
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.3);
            border-radius: 6px;
            color: #f85149;
            font-size: 13px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        /* Block UI column */
        .block-preview {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            min-height: 300px;
        }
        
        /* Properties column */
        .property-item {
            margin-bottom: 16px;
            padding: 12px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        
        .property-label {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .property-value {
            color: #c9d1d9;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }
        
        .property-badge {
            display: inline-block;
            padding: 2px 8px;
            background: #238636;
            color: white;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 8px;
        }
        
        /* TypeScript model display */
        .typescript-model {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            font-family: 'Courier New', Consolas, Monaco, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #c9d1d9;
            white-space: pre;
            overflow-x: auto;
        }
        
        .ts-keyword {
            color: #ff7b72;
        }
        
        .ts-type {
            color: #79c0ff;
        }
        
        .ts-property {
            color: #7ee787;
        }
        
        .ts-comment {
            color: #8b949e;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔧 SiyeFlow Block Renderer Debug Tool</h1>
        
        <div class="tabs" id="tabs"></div>
        
        <div id="tab-contents"></div>
    </div>
    
    <script type="module">
        import { BlockRendererFactory } from '../src/designer/renderers/BlockRendererFactory.ts';
        import { BlockType } from '../src/models/workflow-models.ts';
        
        const blockTypes = [
            {
                type: BlockType.Start,
                name: 'Start',
                icon: '🟢',
                schema: {
                    id: 'start1',
                    type: BlockType.Start,
                    name: 'API Configuration',
                    description: 'Start block with profiles',
                    config: {
                        profiles: [
                            {
                                name: 'Development',
                                description: 'Dev environment',
                                default: true,
                                inputs: {
                                    apiUrl: { type: 'string', value: 'http://localhost:5216' },
                                    userId: { type: 'string', value: 'dev-user' },
                                    timeout: { type: 'number', value: 5000 }
                                }
                            },
                            {
                                name: 'Production',
                                description: 'Prod environment',
                                inputs: {
                                    apiUrl: { type: 'string', value: 'https://api.prod.com' },
                                    userId: { type: 'string', value: 'prod-user' },
                                    timeout: { type: 'number', value: 30000 }
                                }
                            }
                        ],
                        selectedProfile: 'Development'
                    }
                }
            },
            {
                type: BlockType.HttpRequest,
                name: 'HTTP Request',
                icon: '🌐',
                schema: {
                    id: 'http1',
                    type: BlockType.HttpRequest,
                    name: 'Get User Data',
                    description: 'Fetch user information',
                    config: {
                        method: 'GET',
                        url: '{{apiUrl}}/api/users/{{userId}}'
                    },
                    inputPorts: [
                        { name: 'apiUrl', type: 'string', required: true },
                        { name: 'userId', type: 'string', required: true }
                    ],
                    outputPorts: [
                        { name: 'response', type: 'object' }
                    ]
                }
            },
            {
                type: BlockType.Variable,
                name: 'Variable',
                icon: '📦',
                schema: {
                    id: 'var1',
                    type: BlockType.Variable,
                    name: 'Process Data',
                    description: 'Set variables',
                    config: {
                        operation: 'set',
                        variables: {
                            userName: '{{response.name}}',
                            userEmail: '{{response.email}}'
                        }
                    },
                    inputPorts: [
                        { name: 'response', type: 'object' }
                    ],
                    outputPorts: [
                        { name: 'userName', type: 'string' },
                        { name: 'userEmail', type: 'string' }
                    ]
                }
            },
            {
                type: BlockType.Condition,
                name: 'Condition',
                icon: '❓',
                schema: {
                    id: 'cond1',
                    type: BlockType.Condition,
                    name: 'Check Value',
                    description: 'Evaluate condition',
                    config: {
                        expression: '{{value}} > 10'
                    },
                    inputPorts: [
                        { name: 'value', type: 'number' }
                    ],
                    outputPorts: [
                        { name: 'true', type: 'boolean' },
                        { name: 'false', type: 'boolean' }
                    ]
                }
            },
            {
                type: BlockType.Log,
                name: 'Log',
                icon: '📝',
                schema: {
                    id: 'log1',
                    type: BlockType.Log,
                    name: 'Log Message',
                    description: 'Display log message',
                    config: {
                        message: 'User data: {{userData}}',
                        level: 'info'
                    },
                    inputPorts: [
                        { name: 'userData', type: 'object' }
                    ]
                }
            },
            {
                type: BlockType.Delay,
                name: 'Delay',
                icon: '⏰',
                schema: {
                    id: 'delay1',
                    type: BlockType.Delay,
                    name: 'Wait',
                    description: 'Delay execution',
                    config: {
                        milliseconds: 1000
                    },
                    inputPorts: [
                        { name: 'trigger', type: 'any' }
                    ],
                    outputPorts: [
                        { name: 'continue', type: 'any' }
                    ]
                }
            },
            {
                type: BlockType.End,
                name: 'End',
                icon: '🔴',
                schema: {
                    id: 'end1',
                    type: BlockType.End,
                    name: 'Complete',
                    description: 'Workflow completion',
                    config: {
                        outputs: {
                            result: { type: 'object', value: '{{userData}}' }
                        }
                    },
                    inputPorts: [
                        { name: 'in', type: 'any', multiple: true }
                    ]
                }
            }
        ];
        
        const tabsContainer = document.getElementById('tabs');
        const contentsContainer = document.getElementById('tab-contents');
        
        blockTypes.forEach((blockType, index) => {
            // Create tab button
            const tab = document.createElement('button');
            tab.className = `tab ${index === 0 ? 'active' : ''}`;
            tab.innerHTML = `${blockType.icon} ${blockType.name}`;
            tab.onclick = () => activateTab(index);
            tabsContainer.appendChild(tab);
            
            // Create tab content
            const content = document.createElement('div');
            content.className = `tab-content ${index === 0 ? 'active' : ''}`;
            content.innerHTML = createTabContent(blockType, index);
            contentsContainer.appendChild(content);
        });
        
        function activateTab(index) {
            document.querySelectorAll('.tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((content, i) => {
                content.classList.toggle('active', i === index);
            });
        }
        
        // Initialize all blocks on load
        blockTypes.forEach((blockType, index) => {
            renderBlock(index, blockType.schema);
        });
        
        function createTabContent(blockType, index) {
            return `
                <div class="four-column">
                    <div class="column">
                        <div class="column-header">📄 Schema (Editable JSON)</div>
                        <div class="column-content schema-content">
                            <textarea class="schema-editor" id="schema-${index}" spellcheck="false">${JSON.stringify(blockType.schema, null, 2)}</textarea>
                            <div class="schema-actions">
                                <button class="btn" onclick="updateBlock(${index})">Update Block</button>
                                <button class="btn btn-secondary" onclick="resetSchema(${index})">Reset</button>
                            </div>
                            <div class="error-message" id="error-${index}"></div>
                        </div>
                    </div>
                    
                    <div class="column">
                        <div class="column-header">🎨 Block UI Preview</div>
                        <div class="column-content">
                            <div class="block-preview" id="preview-${index}"></div>
                        </div>
                    </div>
                    
                    <div class="column">
                        <div class="column-header">📐 TypeScript Model</div>
                        <div class="column-content" id="typescript-${index}"></div>
                    </div>
                    
                    <div class="column">
                        <div class="column-header">⚙️ Properties</div>
                        <div class="column-content" id="properties-${index}"></div>
                    </div>
                </div>
            `;
        }
        
        // Store original schemas for reset
        const originalSchemas = blockTypes.map(bt => JSON.parse(JSON.stringify(bt.schema)));
        
        // Generate TypeScript model from schema
        function generateTypeScriptModel(schema) {
            let tsModel = '';
            
            // Generate main interface
            tsModel += `<span class="ts-keyword">interface</span> <span class="ts-type">${schema.type}Block</span> {\n`;
            tsModel += `  <span class="ts-property">id</span>: <span class="ts-type">string</span>;\n`;
            tsModel += `  <span class="ts-property">type</span>: <span class="ts-type">BlockType.${schema.type}</span>;\n`;
            tsModel += `  <span class="ts-property">name</span>: <span class="ts-type">string</span>;\n`;
            tsModel += `  <span class="ts-property">description</span>?: <span class="ts-type">string</span>;\n`;
            
            // Generate config interface based on type
            if (schema.config) {
                tsModel += `  <span class="ts-property">config</span>: <span class="ts-type">${schema.type}Config</span>;\n`;
            }
            
            // Add input/output ports
            if (schema.inputPorts) {
                tsModel += `  <span class="ts-property">inputPorts</span>: <span class="ts-type">InputPort[]</span>;\n`;
            }
            if (schema.outputPorts) {
                tsModel += `  <span class="ts-property">outputPorts</span>: <span class="ts-type">OutputPort[]</span>;\n`;
            }
            
            tsModel += `}\n\n`;
            
            // Generate config interface
            if (schema.config) {
                tsModel += `<span class="ts-keyword">interface</span> <span class="ts-type">${schema.type}Config</span> {\n`;
                
                switch (schema.type) {
                    case 'Start':
                        if (schema.config.profiles) {
                            tsModel += `  <span class="ts-property">profiles</span>: <span class="ts-type">Profile[]</span>;\n`;
                            tsModel += `  <span class="ts-property">selectedProfile</span>: <span class="ts-type">string</span>;\n`;
                        }
                        break;
                    case 'HttpRequest':
                        tsModel += `  <span class="ts-property">method</span>: <span class="ts-type">'GET' | 'POST' | 'PUT' | 'DELETE'</span>;\n`;
                        tsModel += `  <span class="ts-property">url</span>: <span class="ts-type">string</span>;\n`;
                        tsModel += `  <span class="ts-property">headers</span>?: <span class="ts-type">Record&lt;string, string&gt;</span>;\n`;
                        tsModel += `  <span class="ts-property">body</span>?: <span class="ts-type">any</span>;\n`;
                        break;
                    case 'Variable':
                        tsModel += `  <span class="ts-property">operation</span>: <span class="ts-type">'set' | 'get' | 'delete'</span>;\n`;
                        tsModel += `  <span class="ts-property">variables</span>: <span class="ts-type">Record&lt;string, any&gt;</span>;\n`;
                        break;
                    case 'Condition':
                        tsModel += `  <span class="ts-property">expression</span>: <span class="ts-type">string</span>;\n`;
                        break;
                    case 'Log':
                        tsModel += `  <span class="ts-property">message</span>: <span class="ts-type">string</span>;\n`;
                        tsModel += `  <span class="ts-property">level</span>: <span class="ts-type">'info' | 'warn' | 'error' | 'debug'</span>;\n`;
                        break;
                    case 'Delay':
                        tsModel += `  <span class="ts-property">milliseconds</span>: <span class="ts-type">number</span>;\n`;
                        break;
                    case 'End':
                        tsModel += `  <span class="ts-property">outputs</span>: <span class="ts-type">Record&lt;string, OutputDefinition&gt;</span>;\n`;
                        break;
                    default:
                        // Generic config properties
                        for (const key in schema.config) {
                            const value = schema.config[key];
                            const type = typeof value === 'object' ? 'any' : typeof value;
                            tsModel += `  <span class="ts-property">${key}</span>: <span class="ts-type">${type}</span>;\n`;
                        }
                }
                
                tsModel += `}\n\n`;
            }
            
            // Add additional interfaces based on block type
            if (schema.type === 'Start' && schema.config?.profiles) {
                tsModel += `<span class="ts-comment">// Profile definition for Start block</span>\n`;
                tsModel += `<span class="ts-keyword">interface</span> <span class="ts-type">Profile</span> {\n`;
                tsModel += `  <span class="ts-property">name</span>: <span class="ts-type">string</span>;\n`;
                tsModel += `  <span class="ts-property">description</span>?: <span class="ts-type">string</span>;\n`;
                tsModel += `  <span class="ts-property">default</span>?: <span class="ts-type">boolean</span>;\n`;
                tsModel += `  <span class="ts-property">inputs</span>: <span class="ts-type">Record&lt;string, InputDefinition&gt;</span>;\n`;
                tsModel += `}\n\n`;
                tsModel += `<span class="ts-keyword">interface</span> <span class="ts-type">InputDefinition</span> {\n`;
                tsModel += `  <span class="ts-property">type</span>: <span class="ts-type">'string' | 'number' | 'boolean' | 'object' | 'array'</span>;\n`;
                tsModel += `  <span class="ts-property">value</span>: <span class="ts-type">any</span>;\n`;
                tsModel += `}\n\n`;
            }
            
            if (schema.type === 'End' && schema.config?.outputs) {
                tsModel += `<span class="ts-comment">// Output definition for End block</span>\n`;
                tsModel += `<span class="ts-keyword">interface</span> <span class="ts-type">OutputDefinition</span> {\n`;
                tsModel += `  <span class="ts-property">type</span>: <span class="ts-type">'string' | 'number' | 'boolean' | 'object' | 'array'</span>;\n`;
                tsModel += `  <span class="ts-property">value</span>: <span class="ts-type">any</span>;\n`;
                tsModel += `}\n\n`;
            }
            
            // Add port interfaces if needed
            if (schema.inputPorts || schema.outputPorts) {
                tsModel += `<span class="ts-comment">// Port definitions</span>\n`;
                tsModel += `<span class="ts-keyword">interface</span> <span class="ts-type">Port</span> {\n`;
                tsModel += `  <span class="ts-property">name</span>: <span class="ts-type">string</span>;\n`;
                tsModel += `  <span class="ts-property">type</span>: <span class="ts-type">string</span>;\n`;
                tsModel += `  <span class="ts-property">required</span>?: <span class="ts-type">boolean</span>;\n`;
                tsModel += `  <span class="ts-property">multiple</span>?: <span class="ts-type">boolean</span>;\n`;
                tsModel += `}\n\n`;
                tsModel += `<span class="ts-keyword">type</span> <span class="ts-type">InputPort</span> = <span class="ts-type">Port</span>;\n`;
                tsModel += `<span class="ts-keyword">type</span> <span class="ts-type">OutputPort</span> = <span class="ts-type">Port</span>;\n`;
            }
            
            return tsModel;
        }
        
        function renderBlock(index, schema) {
            const blockType = blockTypes[index];
            const visualBlock = {
                id: schema.id,
                type: schema.type,
                position: { x: 0, y: 0 },
                width: 320,
                height: 250,
                selected: false
            };
            
            try {
                const renderer = BlockRendererFactory.createRenderer(visualBlock, schema);
                renderer.updatePorts();
                const html = renderer.render();
                
                // Update preview
                const preview = document.getElementById(`preview-${index}`);
                preview.innerHTML = `
                    <div class="workflow-block block-type-${schema.type}" style="width: 320px; position: relative;">
                        ${html}
                    </div>
                `;
                
                // Update TypeScript model
                const typescriptEl = document.getElementById(`typescript-${index}`);
                typescriptEl.innerHTML = `<div class="typescript-model">${generateTypeScriptModel(schema)}</div>`;
                
                // Update properties
                const properties = document.getElementById(`properties-${index}`);
                const ports = {
                    input: visualBlock.inputPorts || [],
                    output: visualBlock.outputPorts || []
                };
                
                properties.innerHTML = `
                    <div class="property-item">
                        <div class="property-label">Block Type</div>
                        <div class="property-value">${schema.type}</div>
                    </div>
                    
                    <div class="property-item">
                        <div class="property-label">Block ID</div>
                        <div class="property-value">${schema.id}</div>
                    </div>
                    
                    <div class="property-item">
                        <div class="property-label">Input Ports</div>
                        <div class="property-value">
                            ${ports.input.length} port(s)
                            ${ports.input.map(p => `<div style="margin-top: 8px;">• ${p.name} <span class="property-badge">${p.type}</span></div>`).join('')}
                        </div>
                    </div>
                    
                    <div class="property-item">
                        <div class="property-label">Output Ports</div>
                        <div class="property-value">
                            ${ports.output.length} port(s)
                            ${ports.output.map(p => `<div style="margin-top: 8px;">• ${p.name} <span class="property-badge">${p.type}</span></div>`).join('')}
                        </div>
                    </div>
                    
                    ${schema.config?.profiles ? `
                        <div class="property-item">
                            <div class="property-label">Profiles</div>
                            <div class="property-value">
                                ${schema.config.profiles.length} profile(s)
                                ${schema.config.profiles.map(p => `<div style="margin-top: 8px;">• ${p.name}${p.default ? ' <span class="property-badge">default</span>' : ''}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                `;
                
                // Hide error
                document.getElementById(`error-${index}`).classList.remove('show');
                
            } catch (error) {
                const errorEl = document.getElementById(`error-${index}`);
                errorEl.textContent = `Error: ${error.message}`;
                errorEl.classList.add('show');
            }
        }
        
        window.updateBlock = function(index) {
            const schemaText = document.getElementById(`schema-${index}`).value;
            try {
                const schema = JSON.parse(schemaText);
                blockTypes[index].schema = schema;
                renderBlock(index, schema);
            } catch (error) {
                const errorEl = document.getElementById(`error-${index}`);
                errorEl.textContent = `Invalid JSON: ${error.message}`;
                errorEl.classList.add('show');
            }
        };
        
        window.resetSchema = function(index) {
            const original = originalSchemas[index];
            blockTypes[index].schema = JSON.parse(JSON.stringify(original));
            document.getElementById(`schema-${index}`).value = JSON.stringify(original, null, 2);
            renderBlock(index, original);
        };
    </script>
</body>
</html>
