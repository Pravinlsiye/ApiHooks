<!DOCTYPE html>
<!-- 
    IMPORTANT: This is a template file preserved during builds.
    SiyeFlowMiddleware.cs replaces {{RoutePrefix}} before serving.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{DocumentTitle}}</title>
    <link rel="stylesheet" href="/{{RoutePrefix}}/style.css">
    {{CustomCss}}
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .designer-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }
        #navbar-container { flex-shrink: 0; }
        .designer-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        #palette-container { flex-shrink: 0; }
        .canvas-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .canvas-wrapper-area {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        #canvas-container { width: 100%; height: 100%; }
        #terminal-container { flex-shrink: 0; }
    </style>
</head>
<body data-theme="{{Theme}}">
    <div class="designer-root">
        <div id="navbar-container"></div>
        <div class="designer-body">
            <div id="palette-container" class="block-palette"></div>
            <div class="canvas-area">
                <div class="canvas-wrapper-area">
                    <div id="canvas-container" class="canvas-container"></div>
                    <div id="minimap-container" class="minimap-container"></div>
                    <div id="floating-toolbar-container" class="floating-toolbar-container"></div>
                </div>
                <div id="terminal-container"></div>
            </div>
        </div>
    </div>

    <script src="/{{RoutePrefix}}/siye-flow-designer.umd.js"></script>
    <script>
        function initDesigner() {
            if (typeof SiyeFlowDesigner === 'undefined') {
                console.error('SiyeFlowDesigner not found.');
                return;
            }

            var designer = new SiyeFlowDesigner.WorkflowDesigner({
                canvasContainerId: 'canvas-container',
                paletteContainerId: 'palette-container',
                navbarContainerId: 'navbar-container',
                floatingToolbarContainerId: 'floating-toolbar-container',
                minimapContainerId: 'minimap-container',
                terminalContainerId: 'terminal-container'
            });

            window.siyeFlowDesigner = designer;

            // Load host API definition from Swagger
            var config = window.SiyeFlowConfig || {};
            var prefix = config.routePrefix || 'siyeflow';
            var swaggerUrl = window.location.origin + '/swagger/v1/swagger.json';

            if (SiyeFlowDesigner.apiManager) {
                SiyeFlowDesigner.apiManager.loadFromUrl(swaggerUrl, { locked: true })
                    .then(function(api) {
                        console.log('Loaded API definition: ' + api.name + ' (' + api.endpoints.length + ' endpoints)');
                    })
                    .catch(function(err) {
                        console.warn('Could not load Swagger definition:', err.message);
                    });
            }

            console.log('SiyeFlow Designer initialized');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDesigner);
        } else {
            initDesigner();
        }
    </script>
</body>
</html>
