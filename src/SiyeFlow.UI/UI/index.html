<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiyeFlow Designer</title>
    <link rel="stylesheet" href="/_siyeflow/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #designer-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="designer-container"></div>
    
    <script>
        // Configuration for embedded mode (set by server)
        window.SiyeFlowConfig = {
            mode: 'embedded',
            apiBasePath: '/siyeflow',
            hostApis: [
                {
                    name: 'Application API',
                    version: '1.0',
                    swaggerUrl: '/swagger/v1/swagger.json',
                    locked: true
                }
            ]
        };
    </script>
    
    <script type="module">
        import { WorkflowDesigner, createEmbeddedConfig } from '/_siyeflow/siye-flow-designer.es.js';
        
        // Create embedded configuration
        const config = createEmbeddedConfig(
            window.SiyeFlowConfig.apiBasePath,
            window.SiyeFlowConfig.hostApis
        );
        
        // Initialize designer with embedded config
        const designer = new WorkflowDesigner('designer-container', config);
        
        console.log('SiyeFlow Designer initialized in embedded mode');
        console.log('Host APIs will be loaded automatically');
        
        // Expose for debugging
        window.siyeFlowDesigner = designer;
    </script>
</body>
</html>
