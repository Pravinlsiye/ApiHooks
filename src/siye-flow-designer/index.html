<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiyeFlow Designer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .designer-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
        }
        #navbar-container {
            flex-shrink: 0;
        }
        .designer-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }
        #palette-container {
            flex-shrink: 0;
        }
        .canvas-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .canvas-wrapper-area {
            flex: 1;
            position: relative;
            min-height: 0;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        #terminal-container {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="designer-root">
        <div id="navbar-container"></div>
        <div class="designer-body">
            <div id="palette-container" class="block-palette"></div>
            <div class="canvas-area">
                <div class="canvas-wrapper-area">
                    <div id="canvas-container" class="canvas-container"></div>
                    <div id="minimap-container" class="minimap-container"></div>
                    <div id="floating-toolbar-container" class="floating-toolbar-container"></div>
                </div>
                <div id="terminal-container"></div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/index.ts"></script>
</body>
</html>
